<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Glowing Inner Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Logo Icon Symbol (Code & Heart Match) -->
  <g filter="url(#shadow)" transform="translate(136, 136)">
    <!-- Connection Nodes -->
    <path d="M120 200 C40 130 30 70 80 30 C120 0 160 30 180 70 C200 30 240 0 280 30 C330 70 320 130 240 200 L180 250 Z" fill="url(#heartGrad)"/>
    <!-- Code Brackets -->
    <path d="M40 100 L0 140 L40 180" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M320 100 L360 140 L320 180" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
